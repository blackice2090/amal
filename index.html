  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { darkMode: 'class' };
    (function () {
      try {
        var s = localStorage.getItem('theme');
        var sys = window.matchMedia('(prefers-color-scheme: dark)').matches;
        var dark = s ? s === 'dark' : sys;
        document.documentElement.classList.toggle('dark', dark);
      } catch (_) { }
    })();
  </script>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>

  <style>
    :root {
      /* Light mode — bright blue */
      --ink: #0B6FA4;
      --panel: rgba(255, 255, 255, .12);
      --panel-2: rgba(255, 255, 255, .18);
      --line: rgba(125, 211, 252, .22);
      --line-2: rgba(94, 234, 212, .35);
      --text: #F8FAFC;
      --muted: #C4E4F3;
      --cyan: #22D3EE;
      --cyan-dim: #5EEAD4;
      --amber: #FCD34D;
      --emerald: #34D399;
      --violet: #C4B5FD;
    }

    html.dark {
      /* Dark mode — deep navy blue */
      --ink: #053A5F;
      --panel: rgba(5, 25, 42, .82);
      --panel-2: rgba(8, 40, 64, .72);
      --line: rgba(125, 211, 252, .22);
      --line-2: rgba(94, 234, 212, .35);
      --text: #F8FAFC;
      --muted: #B7D7E8;
      --cyan: #5EEAD4;
      --cyan-dim: #2DD4BF;
      --amber: #F5B841;
      --emerald: #34D399;
      --violet: #A78BFA;
    }

    html,
    body {
      background: var(--ink);
      color: var(--text);
      transition: background-color .3s ease, color .3s ease;
    }

    body {
      font-family: "ThmanyahSans", system-ui, sans-serif;
      background:
        radial-gradient(900px 500px at 80% 10%, rgba(34, 211, 238, .18), transparent 60%),
        radial-gradient(700px 420px at 15% 80%, rgba(94, 234, 212, .12), transparent 65%),
        var(--ink);
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      transition: background .3s ease;
    }

    .font-display {
      font-family: "ThmanyahSerifDisplay", serif;
    }

    .font-serif-text {
      font-family: "ThmanyahSerifText", serif;
    }

    .font-mono-lat {
      font-family: "JetBrains Mono", ui-monospace, monospace;
    }

    /* blueprint grid */
    .grid-bg {
      background-image:
        linear-gradient(to right, rgba(94, 234, 212, .08) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(94, 234, 212, .08) 1px, transparent 1px);
      background-size: 32px 32px;
    }

    html.dark .grid-bg {
      background-image:
        linear-gradient(to right, rgba(94, 234, 212, .06) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(94, 234, 212, .06) 1px, transparent 1px);
    }

    .grid-bg-fade {
      -webkit-mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 50%, transparent 100%);
      mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 50%, transparent 100%);
    }

    /* grain */
    .grain::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");
    }

    /* panel */
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .panel-2 {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 12px;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .ring-cyan {
      box-shadow: 0 0 0 1px rgba(94, 234, 212, .35), 0 0 40px -8px rgba(94, 234, 212, .35);
    }

    /* orbit ring */
    @keyframes spin-slow {
      to {
        transform: rotate(360deg);
      }
    }

    .orbit {
      animation: spin-slow 28s linear infinite;
    }

    .orbit-rev {
      animation: spin-slow 40s linear infinite reverse;
    }

    /* caret */
    @keyframes caret {
      50% {
        opacity: 0;
      }
    }

    .caret::after {
      content: "▍";
      color: var(--cyan);
      margin-inline-start: .15em;
      animation: caret 1s steps(2) infinite;
    }

    /* reveal */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .rise {
      opacity: 0;
      animation: rise .8s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    /* accordion */
    .acc {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s ease;
    }

    .acc>div {
      overflow: hidden;
    }

    .acc.open {
      grid-template-rows: 1fr;
    }

    /* RTL chevron flip */
    .rtl-flip {
      transform: scaleX(-1);
    }

    /* custom scrollbar hint */
    ::selection {
      background: rgba(94, 234, 212, .35);
      color: #fff;
    }

    /* nav scroll border */
    .nav-scrolled {
      border-bottom: 1px solid rgba(94, 234, 212, .25);
      background: rgba(4, 42, 68, .72);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      transition: background-color .3s ease, border-color .3s ease;
    }

    html.dark .nav-scrolled {
      border-bottom: 1px solid rgba(94, 234, 212, .25);
      background: rgba(3, 28, 48, .82);
    }

    /* folder card */
    .fcard {
      transition: transform .25s cubic-bezier(.2, .7, .2, 1), border-color .2s, box-shadow .2s;
    }

    .fcard:hover {
      transform: translateY(-2px);
      border-color: rgba(94, 234, 212, .45);
      box-shadow: 0 10px 30px -12px rgba(3, 20, 40, .7), 0 0 0 1px rgba(94, 234, 212, .2);
    }

    .fcard.open {
      border-color: rgba(94, 234, 212, .5);
      box-shadow: 0 0 0 1px rgba(94, 234, 212, .3), 0 0 50px -20px rgba(94, 234, 212, .6);
    }

    /* chip */
    .chip {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .35rem .8rem;
      font-size: .78rem;
      color: var(--muted);
      display: inline-flex;
      align-items: center;
      gap: .5rem;
    }

    /* tiny pulse */
    @keyframes pulseDot {

      0%,
      100% {
        opacity: .4
      }

      50% {
        opacity: 1
      }
    }

    .pulse-dot {
      animation: pulseDot 2s ease-in-out infinite;
    }

    /* focus */
    button:focus-visible,
    a:focus-visible {
      outline: 2px solid var(--cyan);
      outline-offset: 3px;
      border-radius: 8px;
    }

    /* launch button shimmer */
    @keyframes shimmer {
      from {
        background-position: 200% center;
      }

      to {
        background-position: -200% center;
      }
    }

    .launch-btn {
      background: linear-gradient(110deg,
          rgba(94, 234, 212, .06) 0%,
          rgba(94, 234, 212, .12) 40%,
          rgba(94, 234, 212, .06) 60%,
          rgba(94, 234, 212, .04) 100%);
      background-size: 200% auto;
    }

    .launch-btn:hover {
      animation: shimmer 2.5s linear infinite;
    }

    /* modal backdrop */
    @keyframes fadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes scaleIn {
      from {
        opacity: 0;
        transform: scale(.96);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .modal-backdrop {
      position: fixed;
      inset: 0;
      z-index: 200;
      background: rgba(3, 20, 38, .88);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
      animation: fadeIn .2s ease forwards;
    }

    .modal-box {
      width: 100%;
      max-width: 1180px;
      height: 90vh;
      background: rgba(5, 30, 52, .95);
      border: 1px solid rgba(94, 234, 212, .3);
      border-radius: 18px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      animation: scaleIn .22s cubic-bezier(.2, .7, .2, 1) forwards;
      box-shadow: 0 40px 120px -20px rgba(0, 0, 0, .8), 0 0 0 1px rgba(94, 234, 212, .18);
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-bottom: 1px solid var(--line);
      flex-shrink: 0;
    }

    /* drive iframe */
    .drive-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* ── DriveBrowserModal gallery ── */
    .drive-toolbar {
      display: flex;
      flex-direction: column;
      gap: 8px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--line);
      background: var(--panel-2);
      flex-shrink: 0;
    }

    .drive-filter-chip {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 3px 11px;
      font-size: .72rem;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: all .18s;
      white-space: nowrap;
      font-family: inherit;
    }

    .drive-filter-chip:hover {
      border-color: rgba(94, 234, 212, .35);
      color: var(--text);
    }

    .drive-filter-chip.df-active {
      background: rgba(94, 234, 212, .1);
      border-color: rgba(94, 234, 212, .45);
      color: var(--cyan);
    }

    .drive-gallery-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
      gap: 12px;
    }

    @media (max-width: 480px) {
      .drive-gallery-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    .drive-tile {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 12px;
      overflow: hidden;
      cursor: pointer;
      transition: transform .2s cubic-bezier(.2, .7, .2, 1), border-color .2s, box-shadow .2s;
      display: flex;
      flex-direction: column;
    }

    .drive-tile:hover {
      transform: translateY(-2px);
      border-color: rgba(94, 234, 212, .35);
      box-shadow: 0 6px 20px -8px rgba(3, 20, 40, .6);
    }

    .drive-thumb {
      width: 100%;
      aspect-ratio: 16/10;
      object-fit: cover;
      display: block;
      background: var(--panel-2);
    }

    .drive-thumb-fallback {
      width: 100%;
      aspect-ratio: 16/10;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--panel-2);
      border-bottom: 1px solid var(--line);
    }

    .drive-file-badge {
      display: inline-flex;
      align-items: center;
      gap: 3px;
      font-size: .64rem;
      font-family: "JetBrains Mono", monospace;
      border-radius: 999px;
      padding: 2px 7px;
      border: 1px solid var(--line);
      color: var(--muted);
      background: var(--panel-2);
    }

    .drive-play-overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, .35);
    }

    /* ── Drive Command Center ── */

    /* search input */
    .exp-input {
      width: 100%;
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--text);
      padding: .5rem .75rem .5rem 2.5rem;
      font-family: inherit;
      font-size: .875rem;
      transition: border-color .2s, box-shadow .2s;
    }

    .exp-input::placeholder {
      color: var(--muted);
      opacity: .7;
    }

    .exp-input:focus {
      outline: none;
      border-color: rgba(94, 234, 212, .5);
      box-shadow: 0 0 0 3px rgba(94, 234, 212, .1);
    }

    /* filter chips */
    .flt-chip {
      display: inline-flex;
      align-items: center;
      gap: .4rem;
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: .28rem .72rem;
      font-size: .77rem;
      color: var(--muted);
      background: transparent;
      cursor: pointer;
      transition: all .2s;
      white-space: nowrap;
    }

    .flt-chip:hover {
      border-color: rgba(94, 234, 212, .35);
      color: var(--text);
    }

    .flt-chip.flt-active {
      background: rgba(94, 234, 212, .1);
      border-color: rgba(94, 234, 212, .45);
      color: var(--cyan);
    }

    /* view-mode toggle */
    .view-btn {
      width: 32px;
      height: 32px;
      display: grid;
      place-items: center;
      border-radius: 7px;
      background: transparent;
      border: 1px solid transparent;
      color: var(--muted);
      cursor: pointer;
      transition: all .2s;
    }

    .view-btn:hover:not(.vb-active) {
      background: rgba(255, 255, 255, .06);
      color: var(--text);
    }

    .view-btn.vb-active {
      background: rgba(94, 234, 212, .1);
      border-color: rgba(94, 234, 212, .3);
      color: var(--cyan);
    }

    /* folder card — grid mode */
    .dcc-card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: transform .22s cubic-bezier(.2, .7, .2, 1), border-color .2s, box-shadow .2s;
    }

    .dcc-card:hover {
      transform: translateY(-2px);
      border-color: rgba(94, 234, 212, .3);
      box-shadow: 0 8px 28px -10px rgba(3, 20, 40, .6);
    }

    .dcc-card.dcc-sel {
      border-color: rgba(94, 234, 212, .55);
      box-shadow: 0 0 0 1px rgba(94, 234, 212, .25), 0 0 40px -16px rgba(94, 234, 212, .4);
    }

    .dcc-card.dcc-conn::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent 0%, rgba(94, 234, 212, .7) 50%, transparent 100%);
    }

    .dcc-card.dcc-unlinked {
      opacity: .75;
    }

    .dcc-card.dcc-unlinked:hover {
      opacity: 1;
    }

    /* tree row */
    .tr-row {
      display: flex;
      align-items: center;
      gap: 7px;
      padding: 5px 10px;
      border-radius: 8px;
      cursor: pointer;
      transition: background .15s, color .15s;
      user-select: none;
      border: 1px solid transparent;
    }

    .tr-row:hover {
      background: rgba(94, 234, 212, .06);
    }

    .tr-row.tr-sel {
      background: rgba(94, 234, 212, .1);
      border-color: rgba(94, 234, 212, .2);
      color: var(--text);
    }

    /* preview panel */
    .prev-pane {
      background: var(--panel-2);
      border: 1px solid var(--line);
      border-radius: 14px;
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    /* smooth entry for preview panel */
    @keyframes slideIn {
      from {
        opacity: 0;
        transform: translateX(-10px);
      }

      to {
        opacity: 1;
        transform: translateX(0);
      }
    }

    .slide-in {
      animation: slideIn .22s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    /* ── Mobile Folder Preview Modal ── */
    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .mobile-preview-backdrop {
      position: fixed;
      inset: 0;
      z-index: 180;
      background: rgba(3, 20, 38, .92);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      animation: fadeIn .18s ease forwards;
    }

    .mobile-preview-shell {
      width: 100%;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      background: rgba(5, 30, 52, .97);
      border-top: 1px solid rgba(94, 234, 212, .2);
      overflow: hidden;
      animation: slideUp .22s cubic-bezier(.2, .7, .2, 1) forwards;
    }

    .mobile-preview-header {
      flex-shrink: 0;
      padding-top: max(12px, env(safe-area-inset-top));
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--line);
      background: rgba(5, 30, 52, .92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
    }

    .mobile-preview-body {
      flex: 1;
      overflow-y: auto;
      min-height: 0;
      padding: 16px;
    }

    .mobile-preview-footer {
      flex-shrink: 0;
      padding-top: 12px;
      padding-left: 16px;
      padding-right: 16px;
      padding-bottom: max(16px, env(safe-area-inset-bottom));
      border-top: 1px solid var(--line);
      background: rgba(5, 30, 52, .95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);

        orderBy: "folder,name_natural",

    async function listDriveSubfolders(folderId, resourceKey) {
      resourceKey = resourceKey || "";
      const cacheKey = `${folderId}::${resourceKey}`;
      const cached = driveFolderCache.get(cacheKey);
      if (cached && Date.now() - cached.loadedAt < DRIVE_CACHE_TTL) return cached.folders;
      const allFolders = [];
      let pageToken = "";
      do {
        const params = new URLSearchParams({
          key: GOOGLE_DRIVE_API_KEY,
          q: `'${folderId}' in parents and (mimeType = '${DRIVE_FOLDER_MIME}' or mimeType = '${DRIVE_SHORTCUT_MIME}') and trashed = false`,
          fields: "nextPageToken,files(id,name,mimeType,webViewLink,modifiedTime,resourceKey,shortcutDetails(targetId,targetMimeType,targetResourceKey))",
          pageSize: "100",
          orderBy: "name_natural",
          spaces: "drive",
          supportsAllDrives: "true",
          includeItemsFromAllDrives: "true",
        });
        if (pageToken) params.set("pageToken", pageToken);
        if (resourceKey) params.set("resourceKey", resourceKey);
        const res = await fetch(`https://www.googleapis.com/drive/v3/files?${params}`);
        if (!res.ok) throw new Error(`Drive API ${res.status}`);

          (f.mimeType === DRIVE_SHORTCUT_MIME &&
           f.shortcutDetails &&
           f.shortcutDetails.targetMimeType === DRIVE_FOLDER_MIME)
        );
        allFolders.push(...folderLike);
        pageToken = data.nextPageToken || "";
      } while (pageToken);
      driveFolderCache.set(cacheKey, { folders: allFolders, loadedAt: Date.now() });

      if (file.mimeType === DRIVE_SHORTCUT_MIME && file.shortcutDetails &&
          file.shortcutDetails.targetMimeType === DRIVE_FOLDER_MIME) {
        return {
          id: file.id,
          name: file.name,
          driveId: file.shortcutDetails.targetId,
          resourceKey: file.shortcutDetails.targetResourceKey || "",
          mimeType: DRIVE_FOLDER_MIME,
          source: "drive",
          isShortcut: true,
          shortcutId: file.id,

      return {

    function useTheme() {
      const [theme, setTheme] = useState(() => {
        if (typeof window === 'undefined') return 'dark';
        const s = localStorage.getItem('theme');
        if (s === 'dark' || s === 'light') return s;
        return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      });
      useEffect(() => {
        document.documentElement.classList.toggle('dark', theme === 'dark');
        try { localStorage.setItem('theme', theme); } catch (_) { }
      }, [theme]);
      const toggle = () => setTheme(t => t === 'dark' ? 'light' : 'dark');
      return [theme, toggle];
    }

          />

      );

      const [isMobile, setIsMobile] = useState(() => {
        if (typeof window === "undefined") return false;
        return window.matchMedia("(max-width: 767px)").matches;
      });
      useEffect(() => {
        const mq = window.matchMedia("(max-width: 767px)");
        const update = () => setIsMobile(mq.matches);
        update();
        if (mq.addEventListener) {
          mq.addEventListener("change", update);
          return () => mq.removeEventListener("change", update);
        }
        mq.addListener(update);
        return () => mq.removeListener(update);
      }, []);
      return isMobile;
    }

    function useInView(ref, opts = { threshold: 0.25 }) {
      const [seen, setSeen] = useState(false);
      useEffect(() => {
        if (!ref.current || seen) return;
        const io = new IntersectionObserver((es) => {
          es.forEach((e) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } });
        }, opts);
        io.observe(ref.current);
        return () => io.disconnect();
      }, [ref, seen]);
      return seen;
    }

    function CountUp({ to, duration = 1400, suffix = "" }) {
      const ref = useRef(null);
      const inView = useInView(ref);
      const [v, setV] = useState(0);
      useEffect(() => {
        if (!inView) return;
        const start = performance.now();
        let raf;
        const tick = (t) => {
          const p = Math.min(1, (t - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          setV(Math.round(to * eased));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [inView, to, duration]);
      return (
        <span ref={ref} className="font-mono-lat tabular-nums" dir="ltr">
          {v.toLocaleString("en-US")}<span className="text-[color:var(--cyan)]">{suffix}</span>
        </span>
      );
    }

    function Typewriter({ text, speed = 70, startDelay = 250, className = "" }) {
      const [i, setI] = useState(0);
      useEffect(() => {
        let to1 = setTimeout(() => {
          const id = setInterval(() => {
            setI((x) => {
              if (x >= text.length) { clearInterval(id); return x; }
              return x + 1;
            });
          }, speed);
          to1 = id;
        }, startDelay);
        return () => clearTimeout(to1) || clearInterval(to1);
      }, [text, speed, startDelay]);
      const done = i >= text.length;
      return (
        <span className={`${className} ${!done ? "caret" : ""}`}>
          {text.slice(0, i)}
        </span>
      );
    }

    // ── TreeRow — recursive row with lazy Drive loading ────────────
    // Root nodes (depth 0) receive pre-fetched children from displayFolders.
    // Drive subfolder nodes (depth ≥ 1 with driveId) load their children
    // lazily on first expand and cache the result via driveFolderCache.
    function TreeRow({ node, depth, selectedKey, onSelect, path }) {
      const [open, setOpen] = useState(false);
      // lazyState: null (not started) | { loading, error, folders }
      const [lazyState, setLazyState] = useState(null);

      const hasDriveId = !!node.driveId;
      const staticChildren = node.children && node.children.length > 0 ? node.children : null;

      // Drive subfolder nodes at depth ≥ 1 that have no pre-loaded children yet
      const isLazyNode = hasDriveId && depth > 0 && !staticChildren;

      // Effective children to render when expanded
      const effectiveChildren = isLazyNode
        ? (lazyState && !lazyState.loading ? lazyState.folders : null)
        : staticChildren;

      const isLoadingChildren = isLazyNode && lazyState && lazyState.loading;
      const childLoadError = isLazyNode && lazyState && lazyState.error;

      // Show expand chevron: for static children if any; for lazy Drive nodes always
      const isExpandable = staticChildren ? staticChildren.length > 0 : isLazyNode;

      const currentPath = [...path, node.name];
      const selKey = currentPath.join('/');
      const isSelected = selectedKey === selKey;

      const handleClick = () => {
        onSelect({ ...node, _key: selKey, _path: currentPath });
        if (!isExpandable) return;
        const newOpen = !open;
        setOpen(newOpen);
        // Trigger lazy load on first open of a Drive subfolder
        if (newOpen && isLazyNode && lazyState === null) {
          setLazyState({ loading: true, error: null, folders: [] });
          listDriveSubfolders(node.driveId, node.resourceKey || "")
            .then(files => {
              setLazyState({ loading: false, error: null, folders: files.map(driveFileToFolderNode) });
            })
            .catch(err => {
              setLazyState({ loading: false, error: err.message, folders: [] });
            });
        }
      };

      const childCount = effectiveChildren ? effectiveChildren.length
        : staticChildren ? staticChildren.length : 0;

      return (
        <div>
          <div
            role="button"
            tabIndex={0}
            onKeyDown={e => e.key === 'Enter' && handleClick()}
            onClick={handleClick}
            style={{ paddingInlineStart: `${10 + depth * 18}px` }}
            className={`tr-row text-sm ${isSelected ? 'tr-sel' : 'text-[color:var(--muted)]'}`}
          >
            {/* expand chevron */}
            <span className="shrink-0 w-4 h-4 grid place-items-center">
              {isExpandable
                ? <Icon name={open ? 'ChevronDown' : 'ChevronLeft'} size={12}
                  className={`rtl-flip transition-transform duration-200 ${open ? 'text-[color:var(--cyan)]' : 'text-[color:var(--muted)]'}`} />
                : <span className="w-1 h-1 rounded-full bg-[color:var(--muted)]/40 mx-auto block"></span>
              }
            </span>
            {/* folder icon */}
            <Icon
              name={open && isExpandable ? 'FolderOpen' : 'Folder'} size={14}
              className={`shrink-0 transition-colors
                ${hasDriveId ? 'text-[color:var(--cyan)]'
                  : open && isExpandable ? 'text-[color:var(--cyan)]'
                    : isExpandable ? 'text-[color:var(--amber)]'
                      : 'text-[color:var(--muted)]/50'}`}
            />
            <span className="flex-1 truncate">{node.name}</span>
            {/* lazy-loading spinner replaces pulse dot while loading */}
            {isLoadingChildren
              ? <span className="w-2.5 h-2.5 rounded-full border border-t-[color:var(--cyan)] border-[color:var(--cyan)]/20 animate-spin shrink-0"></span>
              : hasDriveId
                ? <span className="w-1.5 h-1.5 rounded-full bg-[color:var(--emerald)] pulse-dot shrink-0"></span>
                : null
            }
            {childCount > 0 && (
              <span className="font-mono-lat text-[9px] text-[color:var(--muted)] shrink-0">{childCount}</span>
            )}
          </div>

          {/* accordion children — open when expanded */}
          {open && isExpandable && (
            <div className="acc open">
              <div>
                <div style={{ borderInlineEnd: '1px solid rgba(94,234,212,.15)', marginInlineStart: `${22 + depth * 18}px` }}>
                  {isLoadingChildren ? (
                    <div style={{ paddingInlineStart: `${10 + (depth + 1) * 18}px` }}
                      className="tr-row text-xs text-[color:var(--muted)] gap-2">
                      <span className="w-2.5 h-2.5 rounded-full border border-t-[color:var(--cyan)] border-[color:var(--cyan)]/20 animate-spin shrink-0"></span>
                      <span>جاري المزامنة…</span>
                    </div>
                  ) : childLoadError ? (
                    <div style={{ paddingInlineStart: `${10 + (depth + 1) * 18}px` }}
                      className="tr-row text-xs text-[color:var(--amber)] gap-2">
                      <Icon name="Info" size={11} className="shrink-0" />
                      <span>تعذّر التحميل</span>
                    </div>
                  ) : effectiveChildren && effectiveChildren.length > 0 ? (
                    effectiveChildren.map((child, i) => (
                      <TreeRow key={child.id || i} node={child} depth={depth + 1}
                        selectedKey={selectedKey} onSelect={onSelect} path={currentPath} />
                    ))
                  ) : effectiveChildren && effectiveChildren.length === 0 ? (
                    <div style={{ paddingInlineStart: `${10 + (depth + 1) * 18}px` }}
                      className="tr-row text-xs text-[color:var(--muted)]/50">
                      <span>فارغ</span>
                    </div>
                  ) : null}
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

          {/* subfolder tags — always rendered for height consistency */}
          <div className="mt-auto pt-3 border-t border-[color:var(--line)] min-h-[34px] flex items-center flex-wrap gap-1">
            {f._driveLoading && f.driveId ? (
              <>
                <span className="w-2.5 h-2.5 rounded-full border border-t-[color:var(--cyan)] border-[color:var(--cyan)]/20 animate-spin shrink-0"></span>
                <span className="text-[9px] text-[color:var(--muted)]">جاري المزامنة…</span>

            ) : hasChildren ? (
              <>
                {children.slice(0, 2).map((child, i) => (
                  <span key={child.id || i} className="text-[9px] text-[color:var(--muted)] bg-[color:var(--panel-2)] border border-[color:var(--line)] rounded px-1.5 py-0.5 max-w-[100px] truncate">
                    {child.name}

                {children.slice(2, 4).map((child, i) => (
                  <span key={child.id || i} className="hidden md:inline-flex text-[9px] text-[color:var(--muted)] bg-[color:var(--panel-2)] border border-[color:var(--line)] rounded px-1.5 py-0.5 max-w-[100px] truncate">

                {children.length > 2 && (

    // Subfolder list is driven by Drive API for linked folders:
    // _driveLoading / _driveError / _driveSynced come from getDisplayFolder().
    // Manual children are kept for offline folders.

    // ── Drive file-type helpers (module-level) ─────────────────────

    // Shortcut detection
    function driveIsShortcut(file) { return file.mimeType === DRIVE_SHORTCUT_MIME; }

    // Resolve the real mimeType / id / resourceKey for shortcuts
    function getEffectiveMimeType(file) {
      if (driveIsShortcut(file) && file.shortcutDetails) return file.shortcutDetails.targetMimeType || file.mimeType;
      return file.mimeType;
    }
    function getEffectiveFileId(file) {
      if (driveIsShortcut(file) && file.shortcutDetails) return file.shortcutDetails.targetId || file.id;
      return file.id;
    }
    function getEffectiveResourceKey(file) {
      if (driveIsShortcut(file) && file.shortcutDetails) return file.shortcutDetails.targetResourceKey || "";
      return file.resourceKey || "";
    }

    // Type predicates — all use effective MIME so shortcuts are transparent
    function driveIsFolder(file) { return getEffectiveMimeType(file) === DRIVE_FOLDER_MIME; }
    function driveIsImage(file) { const m = getEffectiveMimeType(file); return !!(m && m.startsWith('image/')); }
    function driveIsPdf(file) { return getEffectiveMimeType(file) === 'application/pdf'; }
    function driveIsVideo(file) { const m = getEffectiveMimeType(file); return !!(m && m.startsWith('video/')); }
    function driveIsDocument(file) {
      const m = getEffectiveMimeType(file);
      if (!m) return false;
      return (
        m.includes('document') || m.includes('presentation') || m.includes('spreadsheet') ||
        m.includes('msword') || m.includes('ms-excel') || m.includes('ms-powerpoint') ||
        m.startsWith('text/')
      );
    }
    function getFileKind(file) {
      if (driveIsFolder(file)) return 'folder';
      if (driveIsImage(file)) return 'image';
      if (driveIsPdf(file)) return 'pdf';
      if (driveIsVideo(file)) return 'video';
      if (driveIsDocument(file)) return 'document';
      return 'other';
    }
    function formatFileSize(bytes) {
      if (!bytes) return '';
      const s = parseInt(bytes, 10);
      if (s < 1024) return `${s} B`;
      if (s < 1048576) return `${(s / 1024).toFixed(0)} KB`;
      return `${(s / 1048576).toFixed(1)} MB`;
    }
    function getFileTypeLabel(file) {
      const k = getFileKind(file);
      if (k === 'folder') return 'مجلد';
      if (k === 'image') return 'صورة';
      if (k === 'pdf') return 'PDF';
      if (k === 'video') return 'فيديو';
      if (k === 'document') return 'مستند';
      return 'ملف';
    }

    // DriveBrowserModal — متصفح ملفات Drive API يحل محل iframe
    // iframe أُزيل لأن Google تمنع التنقّل الداخلي داخل الإطار المضمّن.
    // "فتح في درايف" يبقى كخيار احتياطي لفتح المجلد مباشرةً في نافذة جديدة.
    function DriveBrowserModal({ folderName, driveId, resourceKey, onClose }) {
      const [stack, setStack] = useState([{ id: driveId, name: folderName, resourceKey: resourceKey || "" }]);
      const [items, setItems] = useState([]);
      const [loading, setLoading] = useState(true);
      const [error, setError] = useState(null);
      const [nextPageToken, setNextPageToken] = useState("");
      const [loadingMore, setLoadingMore] = useState(false);
      const [browserView, setBrowserView] = useState("grid");
      const [typeFilter, setTypeFilter] = useState("all");
      const [fileSearch, setFileSearch] = useState("");

      const currentFolder = stack[stack.length - 1];

      useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", handler);
        return () => document.removeEventListener("keydown", handler);
      }, [onClose]);

      useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);

      useEffect(() => {
        let cancelled = false;
        setLoading(true);
        setError(null);
        setItems([]);
        setNextPageToken("");
        setTypeFilter("all");
        setFileSearch("");
        listDriveFolder(currentFolder.id, "", currentFolder.resourceKey)
          .then(data => {
            if (cancelled) return;
            setItems(data.files || []);
            setNextPageToken(data.nextPageToken || "");
            setLoading(false);
          })
          .catch(err => {
            if (cancelled) return;
            setError(err.message);
            setLoading(false);
          });
        return () => { cancelled = true; };
      }, [currentFolder.id]);

      const loadMore = () => {
        if (!nextPageToken || loadingMore) return;
        setLoadingMore(true);
        listDriveFolder(currentFolder.id, nextPageToken, currentFolder.resourceKey)
          .then(data => {
            setItems(prev => [...prev, ...(data.files || [])]);
            setNextPageToken(data.nextPageToken || "");
            setLoadingMore(false);
          })
          .catch(() => setLoadingMore(false));
      };

      const openFolder = (file) => {
        setStack(prev => [...prev, {
          id: getEffectiveFileId(file),
          name: file.name,
          resourceKey: getEffectiveResourceKey(file),
        }]);
      };

      const navigateTo = (idx) => {
        setStack(prev => prev.slice(0, idx + 1));
      };

      const openUrl = buildDriveFolderUrl(currentFolder.id, currentFolder.resourceKey);

      const filteredItems = useMemo(() => {
        let res = items;
        const lq = fileSearch.trim().toLowerCase();
        if (lq) res = res.filter(f => f.name.toLowerCase().includes(lq));
        if (typeFilter !== 'all') res = res.filter(f => getFileKind(f) === typeFilter);
        return res;
      }, [items, fileSearch, typeFilter]);

      const typeChips = [
        { key: 'all', label: 'الكل' },
        { key: 'folder', label: 'مجلدات' },
        { key: 'image', label: 'صور' },
        { key: 'pdf', label: 'PDF' },
        { key: 'video', label: 'فيديو' },
        { key: 'document', label: 'مستندات' },
        { key: 'other', label: 'أخرى' },
      ];

      const BADGE_STYLES = {
        folder:   { bg: 'rgba(34,211,238,.1)',   border: 'rgba(34,211,238,.3)',  color: 'var(--cyan)' },
        image:    { bg: 'rgba(52,211,153,.1)',   border: 'rgba(52,211,153,.3)',  color: 'var(--emerald)' },
        pdf:      { bg: 'rgba(239,68,68,.1)',    border: 'rgba(239,68,68,.3)',   color: '#f87171' },
        video:    { bg: 'rgba(167,139,250,.1)',  border: 'rgba(167,139,250,.3)', color: 'var(--violet)' },
        document: { bg: 'rgba(251,191,36,.1)',   border: 'rgba(251,191,36,.3)',  color: 'var(--amber)' },
        other:    { bg: 'rgba(255,255,255,.05)', border: 'var(--line)',          color: 'var(--muted)' },
      };

      const renderTileThumb = (file, kind) => {
        const thumb = file.thumbnailLink;
        if (kind === 'folder') {
          return (
            <div className="drive-thumb-fallback" style={{ background: 'rgba(34,211,238,.05)' }}>
              <Icon name="Folder" size={42} className="text-[color:var(--cyan)]" style={{ opacity: .55 }} />
            </div>
          );
        }
        if ((kind === 'image' || kind === 'pdf' || kind === 'document') && thumb) {
          return <img src={thumb} alt={file.name} className="drive-thumb" />;
        }
        if (kind === 'video') {
          if (thumb) {
            return (
              <div style={{ position: 'relative', lineHeight: 0 }}>
                <img src={thumb} alt={file.name} className="drive-thumb" />
                <div className="drive-play-overlay">
                  <div style={{ width: 38, height: 38, borderRadius: '50%', background: 'rgba(167,139,250,.82)', display: 'flex', alignItems: 'center', justifyContent: 'center' }}>
                    <Icon name="Play" size={17} style={{ color: '#fff', marginInlineStart: 2 }} />
                  </div>
                </div>
              </div>
            );
          }
          return (
            <div className="drive-thumb-fallback" style={{ background: 'rgba(167,139,250,.06)' }}>
              <Icon name="Film" size={38} style={{ color: 'var(--violet)', opacity: .6 }} />
            </div>
          );
        }
        if (kind === 'pdf') {
          return (
            <div className="drive-thumb-fallback" style={{ background: 'rgba(239,68,68,.06)' }}>
              <Icon name="FileText" size={38} style={{ color: '#f87171', opacity: .6 }} />
            </div>
          );
        }
        if (kind === 'image') {
          return (
            <div className="drive-thumb-fallback" style={{ background: 'rgba(52,211,153,.06)' }}>
              <Icon name="Image" size={38} style={{ color: 'var(--emerald)', opacity: .6 }} />
            </div>
          );
        }
        return (
          <div className="drive-thumb-fallback">
            <Icon name="FileText" size={34} className="text-[color:var(--muted)]" style={{ opacity: .35 }} />
          </div>
        );
      };

      const renderTile = (file) => {
        const kind = getFileKind(file);
        const isShortcut = driveIsShortcut(file);
        const bs = BADGE_STYLES[kind] || BADGE_STYLES.other;
        const label = getFileTypeLabel(file);
        const handleClick = () => {
          if (kind === 'folder') {
            openFolder(file);
          } else {
            window.open(buildDriveFileUrl(file), '_blank', 'noreferrer');
          }
        };
        return (
          <div key={file.id} className="drive-tile" onClick={handleClick}
            role="button" tabIndex={0} onKeyDown={e => e.key === 'Enter' && handleClick()}>
            {/* thumb with optional shortcut corner badge */}
            <div style={{ position: 'relative' }}>
              {renderTileThumb(file, kind)}
              {isShortcut && (
                <div style={{
                  position: 'absolute', top: 5, insetInlineStart: 5,
                  width: 20, height: 20, borderRadius: 5,
                  background: 'rgba(34,211,238,.88)',
                  display: 'flex', alignItems: 'center', justifyContent: 'center',
                }}>
                  <Icon name="Link" size={11} style={{ color: '#fff' }} />
                </div>
              )}
            </div>
            <div style={{ padding: '8px 10px 10px', flex: 1, display: 'flex', flexDirection: 'column', gap: 5 }}>
              <div style={{
                fontSize: '.78rem', fontWeight: 500, lineHeight: 1.35,
                overflow: 'hidden', display: '-webkit-box',
                WebkitLineClamp: 2, WebkitBoxOrient: 'vertical',
                wordBreak: 'break-word', color: 'var(--text)',
              }}>{file.name}</div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 4, flexWrap: 'wrap', marginTop: 'auto' }}>
                <span className="drive-file-badge"
                  style={{ background: bs.bg, borderColor: bs.border, color: bs.color }}>
                  {label}
                </span>
                {isShortcut && (
                  <span className="drive-file-badge"
                    style={{ background: 'rgba(34,211,238,.08)', borderColor: 'rgba(34,211,238,.25)', color: 'var(--cyan)' }}>
                    اختصار
                  </span>
                )}
                {file.size && (
                  <span className="drive-file-badge">{formatFileSize(file.size)}</span>
                )}
              </div>
            </div>
          </div>
        );
      };

      const renderLoadMore = () => nextPageToken ? (
        <div className="pt-4 flex justify-center">
          <button onClick={loadMore} disabled={loadingMore}
            className="flex items-center gap-2 px-4 py-2 rounded-lg border border-[color:var(--line)] text-sm text-[color:var(--muted)] hover:text-[color:var(--text)] hover:border-[color:var(--cyan)]/30 transition disabled:opacity-50">
            {loadingMore
              ? <span className="w-4 h-4 rounded-full border-2 border-t-[color:var(--cyan)] border-[color:var(--cyan)]/20 animate-spin"></span>
              : <Icon name="ChevronDown" size={14} />}
            تحميل المزيد
          </button>
        </div>
      ) : null;

      return (
        <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label="استعراض المجلد">
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>

            {/* ── Header ── */}
            <div className="modal-header">
              <div className="flex items-center gap-3">
                <span className="w-8 h-8 rounded-lg border border-[color:var(--line-2)] bg-[color:var(--panel-2)] grid place-items-center">
                  <Icon name="FolderOpen" size={16} className="text-[color:var(--cyan)]" />
                </span>
                <div>
                  <div className="text-sm font-display font-semibold">{currentFolder.name}</div>
                  <div className="font-mono-lat text-[10px] text-[color:var(--muted)]" dir="ltr">id: {currentFolder.id}</div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <a href={openUrl} target="_blank" rel="noreferrer"
                  className="chip !py-1.5 hover:!text-[color:var(--cyan)] hover:!border-[color:var(--cyan)]/40 transition">
                  <Icon name="ExternalLink" size={13} />
                  <span className="hidden sm:inline">فتح في درايف</span>
                </a>
                <button onClick={onClose} aria-label="إغلاق"
                  className="w-8 h-8 rounded-lg border border-[color:var(--line-2)] grid place-items-center text-[color:var(--muted)] hover:text-[color:var(--text)] transition">
                  <Icon name="X" size={16} />
                </button>
              </div>
            </div>

            {/* ── Breadcrumb ── */}
            <div className="flex items-center gap-1 flex-wrap px-4 py-2.5 border-b border-[color:var(--line)] bg-[color:var(--panel-2)] text-xs">
              <Icon name="Folder" size={12} className="text-[color:var(--muted)] shrink-0" />
              {stack.map((entry, idx) => (
                <React.Fragment key={idx}>
                  {idx > 0 && <span className="text-[color:var(--line-2)] mx-0.5">/</span>}
                  <button
                    onClick={() => navigateTo(idx)}
                    disabled={idx === stack.length - 1}
                    className={`transition ${idx === stack.length - 1
                      ? 'text-[color:var(--text)] font-medium cursor-default'
                      : 'text-[color:var(--muted)] hover:text-[color:var(--cyan)]'}`}
                  >
                    {entry.name}
                  </button>
                </React.Fragment>
              ))}
            </div>

            {/* ── Toolbar ── */}
            <div className="drive-toolbar">
              <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
                {/* file search */}
                <div style={{ position: 'relative', flex: 1 }}>
                  <span style={{ position: 'absolute', insetInlineStart: 10, top: '50%', transform: 'translateY(-50%)', pointerEvents: 'none', lineHeight: 0 }}>
                    <Icon name="Search" size={14} className="text-[color:var(--muted)]" />
                  </span>
                  <input
                    type="search"
                    className="exp-input"
                    style={{ paddingInlineStart: '2.1rem', paddingInlineEnd: '.6rem' }}
                    placeholder="بحث في هذا المجلد…"
                    value={fileSearch}
                    onChange={e => setFileSearch(e.target.value)}
                    dir="rtl"
                  />
                </div>
                {/* view toggle */}
                <div style={{ display: 'flex', gap: 2, padding: 3, borderRadius: 8, background: 'var(--panel-2)', border: '1px solid var(--line)', flexShrink: 0 }}>
                  {[{ mode: 'grid', icon: 'LayoutGrid', title: 'شبكي' },
                    { mode: 'list', icon: 'AlignJustify', title: 'قائمة' }].map(vm => (
                    <button key={vm.mode} onClick={() => setBrowserView(vm.mode)} title={vm.title}
                      className={`view-btn ${browserView === vm.mode ? 'vb-active' : ''}`}>
                      <Icon name={vm.icon} size={14} />
                    </button>
                  ))}
                </div>
              </div>
              {/* type filter chips */}
              <div style={{ display: 'flex', gap: 5, flexWrap: 'wrap', alignItems: 'center' }}>
                {typeChips.map(tc => (
                  <button key={tc.key} onClick={() => setTypeFilter(tc.key)}
                    className={`drive-filter-chip ${typeFilter === tc.key ? 'df-active' : ''}`}>
                    {tc.label}
                  </button>
                ))}
              </div>
            </div>

            {/* ── Body ── */}
            <div className="flex-1 overflow-y-auto p-4" style={{ minHeight: 0 }}>
              {loading ? (
                <div className="flex flex-col items-center justify-center h-48 gap-3 text-[color:var(--muted)]">
                  <div className="w-8 h-8 rounded-full border-2 border-t-[color:var(--cyan)] border-[color:var(--cyan)]/20 animate-spin"></div>
                  <span className="text-sm">جاري تحميل الملفات…</span>
                </div>
              ) : error ? (
                <div className="flex flex-col items-center justify-center h-48 gap-3 text-center px-6">
                  <Icon name="Info" size={28} className="text-[color:var(--amber)] opacity-70 shrink-0" />
                  <p className="text-sm text-[color:var(--muted)] leading-relaxed max-w-md">
                    تعذر تحميل محتويات المجلد. تأكدي أن المجلد عام أو مشارك بصلاحية Anyone with the link، وأن Google Drive API مفعّل، وأن API key مقيّد بشكل صحيح.
                  </p>
                  <span className="font-mono-lat text-[10px] text-[color:var(--muted)]/50" dir="ltr">{error}</span>
                </div>
              ) : items.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-48 gap-3 text-[color:var(--muted)]">
                  <Icon name="FolderOpen" size={36} className="opacity-30" />
                  <span className="text-sm">لا توجد عناصر داخل هذا المجلد.</span>
                </div>
              ) : filteredItems.length === 0 ? (
                <div className="flex flex-col items-center justify-center h-40 gap-3 text-[color:var(--muted)]">
                  <Icon name="Search" size={32} className="opacity-25" />
                  <span className="text-sm">لا توجد نتائج تطابق البحث أو الفلتر.</span>
                  <button onClick={() => { setFileSearch(''); setTypeFilter('all'); }}
                    className="text-xs text-[color:var(--cyan)] hover:underline">
                    مسح الفلاتر
                  </button>
                </div>
              ) : browserView === 'grid' ? (
                <div>
                  <div className="drive-gallery-grid">
                    {filteredItems.map(file => renderTile(file))}
                  </div>
                  {renderLoadMore()}
                </div>
              ) : (
                /* list view */
                <div className="space-y-1.5">
                  {filteredItems.map(file => {
                    const isDir = driveIsFolder(file);
                    const isShortcut = driveIsShortcut(file);
                    return (
                      <div key={file.id}
                        className="flex items-center gap-3 p-3 rounded-xl border border-[color:var(--line)] bg-[color:var(--panel)] hover:border-[color:var(--cyan)]/30 transition group">
                        <span className={`w-9 h-9 shrink-0 rounded-lg border grid place-items-center relative
                          ${isDir ? 'border-[color:var(--cyan)]/25 bg-[color:var(--cyan)]/5' : 'border-[color:var(--line-2)] bg-[color:var(--panel-2)]'}`}>
                          <Icon name={isDir ? 'Folder' : 'FileText'} size={16}
                            className={isDir ? 'text-[color:var(--cyan)]' : 'text-[color:var(--amber)]'} />
                          {isShortcut && (
                            <span style={{
                              position: 'absolute', bottom: -4, insetInlineEnd: -4,
                              width: 14, height: 14, borderRadius: 3,
                              background: 'rgba(34,211,238,.9)',
                              display: 'flex', alignItems: 'center', justifyContent: 'center',
                            }}>
                              <Icon name="Link" size={8} style={{ color: '#fff' }} />
                            </span>
                          )}
                        </span>
                        <div className="flex-1 min-w-0">
                          <div className="flex items-center gap-1.5 flex-wrap">
                            <span className="text-sm font-medium leading-snug truncate">{file.name}</span>
                            {isShortcut && (
                              <span className="drive-file-badge shrink-0"
                                style={{ background: 'rgba(34,211,238,.08)', borderColor: 'rgba(34,211,238,.25)', color: 'var(--cyan)' }}>
                                اختصار
                              </span>
                            )}
                          </div>
                          {file.modifiedTime && (
                            <div className="font-mono-lat text-[10px] text-[color:var(--muted)] mt-0.5" dir="ltr">
                              {new Date(file.modifiedTime).toLocaleDateString('ar-SA')}
                              {file.size ? ` · ${formatFileSize(file.size)}` : ''}
                            </div>
                          )}
                        </div>
                        {isDir ? (
                          <button onClick={() => openFolder(file)}
                            className="shrink-0 text-[10px] font-mono-lat text-[color:var(--cyan)] border border-[color:var(--cyan)]/25 rounded-lg px-2.5 py-1.5 hover:bg-[color:var(--cyan)]/8 transition whitespace-nowrap">
                            فتح داخل الصفحة
                          </button>
                        ) : (
                          <a href={buildDriveFileUrl(file)} target="_blank" rel="noreferrer"
                            className="shrink-0 text-[10px] font-mono-lat text-[color:var(--muted)] border border-[color:var(--line)] rounded-lg px-2.5 py-1.5 hover:text-[color:var(--text)] hover:border-[color:var(--line-2)] transition whitespace-nowrap">
                            عرض
                          </a>
                        )}
                      </div>
                    );
                  })}
                  {renderLoadMore()}
                </div>
              )}
            </div>
          </div>
        </div>
      );
    }

    function Contact() {
      const c = teacherInfo.contacts;
      const rows = [
        { icon: "Phone", label: "جوال", value: c.phone, href: `tel:${c.phone}` },
        { icon: "Mail", label: "بريد", value: c.email, href: `mailto:${c.email}` },
        { icon: "Linkedin", label: "LinkedIn", value: "linkedin.com/in/…", href: c.linkedin },
        { icon: "Github", label: "GitHub", value: "github.com/…", href: c.github },
        { icon: "Twitter", label: "X", value: "x.com/…", href: c.twitter },
      ];
      return (
        <section id="contact" className="relative py-20">
          <div className="max-w-6xl mx-auto px-5 md:px-8">
            <div className="panel p-6 md:p-10 relative overflow-hidden">
              <div className="absolute inset-0 grid-bg opacity-60 pointer-events-none"></div>
              <div className="relative grid md:grid-cols-5 gap-8">
                <div className="md:col-span-2">
                  <div className="font-mono-lat text-xs text-[color:var(--cyan)]" dir="ltr">// contact</div>
                  <h2 className="font-display font-semibold text-3xl md:text-4xl tracking-tight mt-2">للتواصل</h2>
                  <p className="font-serif-text text-[color:var(--muted)] mt-3 text-sm leading-[1.9] max-w-md">
                  </p>
                  <a href={`mailto:${c.email}`}
                    className="inline-flex items-center gap-2 mt-6 px-4 py-2.5 rounded-lg border border-[color:var(--cyan)]/40 text-[color:var(--cyan)] hover:bg-[color:var(--cyan)]/10 transition text-sm">
                    <Icon name="Send" size={15} />
                    ابدء محادثة
                  </a>
                </div>
                <div className="md:col-span-3 grid sm:grid-cols-2 gap-3">
                  {rows.map((r) => (
                    <a key={r.label} href={r.href} target="_blank" rel="noreferrer"
                      className="panel-2 p-4 flex items-center gap-3 hover:border-[color:var(--line-2)] transition group">
                      <span className="w-10 h-10 rounded-lg grid place-items-center border border-[color:var(--line-2)] bg-[color:var(--panel)]">
                        <Icon name={r.icon} size={16} className="text-[color:var(--cyan)]" />
                      </span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-xs text-[color:var(--muted)]">{r.label}</span>
                        <span className="block text-sm font-mono-lat truncate" dir="ltr">{r.value}</span>
                      </span>
                      <Icon name="ArrowUpLeft" size={14} className="text-[color:var(--muted)] group-hover:text-[color:var(--cyan)] rtl-flip" />
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      const y = new Date().getFullYear();
      return (
        <footer className="border-t border-[color:var(--line)] py-8 mt-10">
          <div className="max-w-6xl mx-auto px-5 md:px-8 flex flex-wrap items-center justify-between gap-4 text-xs text-[color:var(--muted)]">
            <div className="flex items-center gap-2">
              <Icon name="Code2" size={14} className="text-[color:var(--cyan)]" />
              <span>{teacherInfo.name} · جميع الحقوق محفوظة © {y}</span>
            </div>
            <div className="font-mono-lat" dir="ltr">built with care · v1.0</div>
          </div>
        </footer>
      );
    }

    function ParticlesBackground() {
      const initParticles = React.useCallback(function (isDark) {
        var oldCanvas = document.querySelector("#particles-js canvas");
        if (oldCanvas) oldCanvas.remove();

        if (window.pJSDom && window.pJSDom.length > 0) {
          window.pJSDom.forEach(function (p) { p.pJS.fn.vendors.destroypJS(); });
          window.pJSDom = [];
        }

        var colors = isDark
          ? { particles: "#00f5ff", lines: "#00d9ff", accent: "#0096c7" }
          : { particles: "#0277bd", lines: "#0288d1", accent: "#039be5" };

        window.particlesJS("particles-js", {
          particles: {
            number: { value: 140, density: { enable: true, value_area: 800 } },
            color: { value: colors.particles },
            shape: { type: "circle", stroke: { width: 0.5, color: colors.accent } },
            opacity: {
              value: 0.7,
              random: true,
              anim: { enable: true, speed: 1, opacity_min: 0.3 },
            },
            size: {
              value: 3,
              random: true,
              anim: { enable: true, speed: 2, size_min: 1 },
            },
            line_linked: {
              enable: true,
              distance: 160,
              color: colors.lines,
              opacity: 0.4,
              width: 1.2,
            },
            move: { enable: true, speed: 2, random: true, out_mode: "bounce" },
          },
          interactivity: {
            detect_on: "canvas",
            events: {
              onhover: { enable: true, mode: "grab" },
              onclick: { enable: true, mode: "push" },
              resize: true,
            },
            modes: {
              grab: { distance: 220, line_linked: { opacity: 0.8 } },
              push: { particles_nb: 4 },
              repulse: { distance: 180, duration: 0.4 },
            },
          },
          retina_detect: true,
        });
      }, []);

      React.useEffect(function () {
        var html = document.documentElement;
        var detectDark = function () {
          return html.classList.contains("dark") ||
            html.getAttribute("data-theme") === "dark";
        };

        initParticles(detectDark());

        var observer = new MutationObserver(function () {
          initParticles(detectDark());
        });
        observer.observe(html, {
          attributes: true,
          attributeFilter: ["class", "data-theme"],
        });

        return function () { observer.disconnect(); };
      }, [initParticles]);

      return <div id="particles-js" />;
    }

    function App() {
      return (
        <div dir="rtl" lang="ar">
          <ParticlesBackground />
          <div className="app-content">
            <Nav />
            <main>
              <Hero />
              <Stats />
              <Portfolio />
              <Contact />
            </main>
            <Footer />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
