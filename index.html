      mask-image: radial-gradient(ellipse 80% 60% at 50% 40%, #000 50%, transparent 100%);
    }

    /* grain */
    .grain::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .06;
      mix-blend-mode: overlay;
      background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)' opacity='.9'/></svg>");

    /* panel */
    .panel {

      border: 1px solid var(--line);
      border-radius: 14px;

    /* orbit ring */

      to {
        transform: rotate(360deg);
      }

    .orbit {
      animation: spin-slow 28s linear infinite;
    }

    .orbit-rev {
      animation: spin-slow 40s linear infinite reverse;
    }

    /* caret */

      50% {
        opacity: 0;
      }

    .caret::after {
      content: "▍";
      color: var(--cyan);
      margin-inline-start: .15em;
      animation: caret 1s steps(2) infinite;
    }

    /* reveal */
    @keyframes rise {
      from {
        opacity: 0;
        transform: translateY(14px);
      }

      to {
        opacity: 1;
        transform: none;
      }
    }

    .rise {

    /* accordion */
    .acc {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows .32s ease;
    }

    .acc>div {
      overflow: hidden;
    }

    .acc.open {

    }

    function useInView(ref, opts = { threshold: 0.25 }) {
      const [seen, setSeen] = useState(false);
      useEffect(() => {
        if (!ref.current || seen) return;
        const io = new IntersectionObserver((es) => {
          es.forEach((e) => { if (e.isIntersecting) { setSeen(true); io.disconnect(); } });
        }, opts);
        io.observe(ref.current);
        return () => io.disconnect();
      }, [ref, seen]);
      return seen;
    }

    function CountUp({ to, duration = 1400, suffix = "" }) {
      const ref = useRef(null);
      const inView = useInView(ref);
      const [v, setV] = useState(0);
      useEffect(() => {
        if (!inView) return;
        const start = performance.now();
        let raf;
        const tick = (t) => {
          const p = Math.min(1, (t - start) / duration);
          const eased = 1 - Math.pow(1 - p, 3);
          setV(Math.round(to * eased));
          if (p < 1) raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
        return () => cancelAnimationFrame(raf);
      }, [inView, to, duration]);
      return (
        <span ref={ref} className="font-mono-lat tabular-nums" dir="ltr">
          {v.toLocaleString("en-US")}<span className="text-[color:var(--cyan)]">{suffix}</span>
        </span>
      );
    }

    function Typewriter({ text, speed = 70, startDelay = 250, className = "" }) {
      const [i, setI] = useState(0);
      useEffect(() => {
        let to1 = setTimeout(() => {
          const id = setInterval(() => {
            setI((x) => {
              if (x >= text.length) { clearInterval(id); return x; }
              return x + 1;
            });
          }, speed);
          to1 = id;
        }, startDelay);
        return () => clearTimeout(to1) || clearInterval(to1);
      }, [text, speed, startDelay]);
      const done = i >= text.length;
      return (
        <span className={`${className} ${!done ? "caret" : ""}`}>
          {text.slice(0, i)}
        </span>
      );
    }

                {teacherInfo.tagline}
              </p>

              <div className="mt-6 flex flex-wrap gap-2.5 rise" style={{ animationDelay: "1.05s" }}>
                <span className="chip"><Icon name="Cpu" size={14} className="text-[color:var(--cyan)]" />{teacherInfo.specialization}</span>
                <span className="chip"><Icon name="GraduationCap" size={14} className="text-[color:var(--amber)]" />{teacherInfo.degree}</span>
                <span className="chip"><Icon name="Clock3" size={14} className="text-[color:var(--emerald)]" />خبرة {teacherInfo.experience}</span>
              </div>

              <div className="mt-8 flex items-center gap-3 rise" style={{ animationDelay: "1.2s" }}>
                {socials.map((s) => (
                  <a key={s.k} href={s.href} aria-label={s.label} title={s.label}
                    className="w-11 h-11 rounded-full border border-[color:var(--line-2)] bg-[color:var(--panel)] grid place-items-center text-[color:var(--muted)] hover:text-[color:var(--cyan)] hover:border-[color:var(--cyan)]/50 hover:-translate-y-0.5 transition">
                    <Icon name={s.icon} size={18} />
                  </a>
                ))}
              </div>
            </div>

            {/* Avatar column */}
            <div className="md:col-span-5 order-1 md:order-2">
              <div className="relative mx-auto w-[260px] h-[260px] md:w-[320px] md:h-[320px]">
                <div className="absolute inset-0 rounded-full border border-dashed border-[color:var(--line-2)] orbit"></div>
                <div className="absolute inset-4 rounded-full border border-dashed border-[color:var(--line)] orbit-rev"></div>
                <div className="absolute inset-8 rounded-full ring-cyan bg-[color:var(--panel)] grid place-items-center overflow-hidden">
                  <div className="absolute inset-0 grid-bg opacity-40"></div>
                  <Icon name="Code2" size={88} className="text-[color:var(--cyan)] relative" strokeWidth={1.3} />
                </div>
                {/* floating tags */}
                <div className="absolute -top-3 -start-3 chip bg-[color:var(--panel)]">
                  <span className="w-1.5 h-1.5 rounded-full bg-[color:var(--amber)]"></span>
                  <span className="font-mono-lat" dir="ltr">py · js · html</span>
                </div>
                <div className="absolute -bottom-3 -end-3 chip bg-[color:var(--panel)]">
                  <Icon name="Sparkles" size={12} className="text-[color:var(--cyan)]" />
                  <span>تعليم إبداعي</span>
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Stats() {
      return (
        <section id="stats" className="relative py-20">
          <div className="max-w-6xl mx-auto px-5 md:px-8">
            <SectionHeader kicker="// numbers" title="لغة الأرقام" sub="مؤشرات حيّة من مسيرة التدريس والبرامج." />
            <div className="mt-10 grid grid-cols-2 md:grid-cols-4 gap-4 md:gap-5">
              {statsData.map((s, idx) => (
                <div key={s.id} className="panel relative p-5 md:p-6 overflow-hidden group">
                  <div className="absolute top-0 inset-x-0 h-px bg-gradient-to-l from-transparent via-[color:var(--cyan)]/50 to-transparent opacity-0 group-hover:opacity-100 transition"></div>
                  <Icon name={s.icon} size={72} className="absolute -top-3 -start-3 text-[color:var(--line-2)] opacity-40 rtl-flip" strokeWidth={1} />
                  <div className="relative">
                    <div className="font-mono-lat text-xs text-[color:var(--muted)]" dir="ltr">0{idx + 1}</div>
                    <div className="mt-2 text-3xl md:text-4xl font-semibold leading-none">
                      <CountUp to={s.value} suffix={s.suffix} />
                    </div>
                    <div className="mt-3 text-sm text-[color:var(--muted)]">{s.label}</div>
                  </div>
                </div>
              ))}
            </div>
          </div>
        </section>
      );
    }

    function SectionHeader({ kicker, title, sub }) {
      return (
        <div className="flex items-end justify-between gap-6 flex-wrap">
          <div>
            <div className="font-mono-lat text-xs text-[color:var(--cyan)]" dir="ltr">{kicker}</div>
            <h2 className="font-display font-semibold text-3xl md:text-4xl tracking-tight mt-2">{title}</h2>
            {sub && <p className="text-[color:var(--muted)] text-sm mt-2 max-w-xl">{sub}</p>}
          </div>
          <div className="hidden md:flex items-center gap-2 text-[color:var(--muted)] text-xs font-mono-lat" dir="ltr">
            <span className="w-8 h-px bg-[color:var(--line-2)]"></span>
            <span>section</span>
          </div>
        </div>
      );
    }

    // Recursive tree node — renders any depth of nested subfolders
    function TreeNode({ node, depth = 0 }) {
      const [open, setOpen] = useState(false);
      const hasChildren = node.children && node.children.length > 0;

      return (
        <div>
          <button
            onClick={() => hasChildren && setOpen(!open)}
            aria-expanded={hasChildren ? open : undefined}
            style={{ paddingInlineStart: `${12 + depth * 16}px` }}
            className={`w-full flex items-center gap-3 px-3 py-2 rounded-lg text-start transition
              ${hasChildren ? "hover:bg-[color:var(--panel-2)] cursor-pointer" : "cursor-default"}
              ${open ? "text-[color:var(--text)]" : "text-[color:var(--muted)]"}`}
          >
            <span className="shrink-0 w-4 h-4 grid place-items-center">
              {hasChildren
                ? <Icon name={open ? "ChevronDown" : "ChevronLeft"} size={12}
                  className={`rtl-flip transition ${open ? "text-[color:var(--cyan)]" : "text-[color:var(--line-2)]"}`} />
                : <span className="w-1.5 h-1.5 rounded-full bg-[color:var(--line-2)] inline-block"></span>
              }
            </span>
            <span className="shrink-0">
              <Icon name={open && hasChildren ? "FolderOpen" : "Folder"} size={14}
                className={open && hasChildren ? "text-[color:var(--cyan)]" : hasChildren ? "text-[color:var(--amber)]" : "text-[color:var(--muted)]"} />
            </span>
            <span className="flex-1 text-sm truncate">{node.name}</span>
            {hasChildren && (
              <span className="font-mono-lat text-[10px] text-[color:var(--muted)] shrink-0 me-1">
                {node.children.length}
              </span>
            )}
          </button>
          {hasChildren && open && (
            <div className="border-e border-[color:var(--line)] ms-5">
              {node.children.map((child, i) => (
                <TreeNode key={i} node={child} depth={depth + 1} />
              ))}
            </div>
          )}
        </div>
      );
    }

    function FolderCard({ f }) {
      const [open, setOpen] = useState(false);
      const hasChildren = f.children && f.children.length > 0;
      const count = f.children ? f.children.length : 0;
      const openUrl = f.driveId
        ? `https://drive.google.com/drive/folders/${f.driveId}`
        : null;

      const openPopup = (e) => {
        e.stopPropagation();
        window.open(
          openUrl,
          `drive_${f.id}`,
          `width=1280,height=860,resizable=yes,scrollbars=yes,menubar=no,toolbar=no,location=yes,status=no`
        );
      };

      return (
        <div className={`fcard panel p-5 md:p-6 ${open ? "open" : ""}`}>

          {/* ── Card header ── */}
          <button
            onClick={() => setOpen(!open)}
            aria-expanded={open}
            className="w-full flex items-center gap-4 text-start"
          >
            <span className={`w-11 h-11 shrink-0 rounded-lg border grid place-items-center transition
              ${open ? "border-[color:var(--cyan)]/40 bg-[color:var(--cyan)]/5" : "border-[color:var(--line-2)] bg-[color:var(--panel-2)]"}`}>
              <Icon name={open ? "FolderOpen" : "Folder"} size={20}
                className={open ? "text-[color:var(--cyan)]" : "text-[color:var(--amber)]"} />
            </span>
            <span className="flex-1 min-w-0">
              <span className="block font-display font-semibold text-base md:text-lg truncate">{f.name}</span>
              <span className="block mt-0.5 text-xs text-[color:var(--muted)] font-mono-lat" dir="ltr">
                {String(f.id).padStart(2, "0")} · {hasChildren ? `${count} items` : "empty"}
                {f.driveId && <span className="text-[color:var(--emerald)] ms-2">● drive</span>}
              </span>
            </span>
            <Icon name="ChevronDown" size={18}
              className={`shrink-0 text-[color:var(--muted)] transition ${open ? "rotate-180 text-[color:var(--cyan)]" : ""}`} />
          </button>

          {/* ── Accordion body ── */}
          <div className={`acc ${open ? "open" : ""}`}>
            <div>
              <div className="mt-4 pt-4 border-t border-[color:var(--line)]">

                {f.driveId ? (
                  /* ── Drive-linked ── */
                  <>
                    {/* subfolder tree */}
                    {hasChildren && (
                      <div className="mb-4 space-y-0.5">
                        {f.children.map((child, i) => (
                          <TreeNode key={i} node={child} depth={0} />
                        ))}
                      </div>
                    )}

                    {/* popup launch button */}
                    <button
                      onClick={openPopup}
                      className="launch-btn w-full group flex items-center justify-between gap-3
                        px-4 py-3.5 rounded-xl border border-[color:var(--cyan)]/25
                        hover:border-[color:var(--cyan)]/55 transition"
                    >
                      <div className="flex items-center gap-3">
                        <span className="w-10 h-10 shrink-0 rounded-lg bg-[color:var(--panel-2)]
                          border border-[color:var(--cyan)]/30 grid place-items-center">
                          <Icon name="Monitor" size={17} className="text-[color:var(--cyan)]" />
                        </span>
                        <div className="text-start">
                          <div className="text-sm font-medium">
                            استعراض «{f.name}» في نافذة مستقلة
                          </div>
                          <div className="font-mono-lat text-[10px] text-[color:var(--muted)] mt-0.5" dir="ltr">
                            opens drive.google.com · full access · no restrictions
                          </div>
                        </div>
                      </div>
                      <Icon name="ExternalLink" size={16}
                        className="text-[color:var(--cyan)]/50 group-hover:text-[color:var(--cyan)] shrink-0 transition" />
                    </button>
                  </>
                ) : (
                  /* ── No Drive ID yet ── */
                  <>
                    {hasChildren ? (
                      <div className="space-y-0.5">
                        {f.children.map((child, i) => (
                          <TreeNode key={i} node={child} depth={0} />
                        ))}
                      </div>
                    ) : (
                      <p className="text-xs text-[color:var(--muted)] px-3 py-2 font-mono-lat" dir="ltr">
                        // no subfolders yet
                      </p>
                    )}
                    <div className="mt-3 flex items-center gap-2 p-2.5 rounded-lg border border-dashed
                      border-[color:var(--line-2)] text-[color:var(--muted)] text-xs">
                      <Icon name="Info" size={13} className="shrink-0" />
                      أضيفي <span className="font-mono-lat mx-1">driveId</span> لهذا المجلد لتفعيل الرابط المباشر.
                    </div>
                  </>
                )}

              </div>
            </div>
          </div>
        </div>
      );
    }

    function Portfolio() {
      return (
        <section id="portfolio" className="relative py-20">
          <div className="max-w-6xl mx-auto px-5 md:px-8">
            <SectionHeader kicker="// folders" title="استكشف الملفات"
              sub="هيكلة مجلدات جوجل درايف — انقر على أي مجلد لاستعراض محتوياته." />

            <div className="mt-4 flex items-center justify-end">
              <div className="chip">
                <Icon name="Layers" size={13} className="text-[color:var(--amber)]" />
                <span className="font-mono-lat" dir="ltr">
                  {String(foldersData.length).padStart(2, "0")} folders
                </span>
              </div>
            </div>

            <div className="mt-4 grid gap-4 md:gap-5 md:grid-cols-2 lg:grid-cols-3">
              {foldersData.map((f) => <FolderCard key={f.id} f={f} />)}
            </div>
          </div>
        </section>
      );
    }

    // Shared fullscreen modal — receives the folder name + Drive ID
    function DriveModal({ folderName, driveId, onClose }) {
      const embedUrl = `https://drive.google.com/embeddedfolderview?id=${driveId}#grid`;
      const openUrl = `https://drive.google.com/drive/folders/${driveId}`;

      useEffect(() => {
        const handler = (e) => { if (e.key === "Escape") onClose(); };
        document.addEventListener("keydown", handler);
        return () => document.removeEventListener("keydown", handler);
      }, [onClose]);

      useEffect(() => {
        document.body.style.overflow = "hidden";
        return () => { document.body.style.overflow = ""; };
      }, []);

      return (
        <div className="modal-backdrop" onClick={onClose} role="dialog" aria-modal="true" aria-label="استعراض المجلد">
          <div className="modal-box" onClick={(e) => e.stopPropagation()}>
            <div className="modal-header">
              <div className="flex items-center gap-3">
                <span className="w-8 h-8 rounded-lg border border-[color:var(--line-2)] bg-[color:var(--panel-2)] grid place-items-center">
                  <Icon name="FolderOpen" size={16} className="text-[color:var(--cyan)]" />
                </span>
                <div>
                  <div className="text-sm font-display font-semibold">{folderName}</div>
                  <div className="font-mono-lat text-[10px] text-[color:var(--muted)]" dir="ltr">id: {driveId}</div>
                </div>
              </div>
              <div className="flex items-center gap-2">
                <a href={openUrl} target="_blank" rel="noreferrer"
                  className="chip !py-1.5 hover:!text-[color:var(--cyan)] hover:!border-[color:var(--cyan)]/40 transition">
                  <Icon name="ExternalLink" size={13} />
                  <span className="hidden sm:inline">فتح في درايف</span>
                </a>
                <button onClick={onClose} aria-label="إغلاق"
                  className="w-8 h-8 rounded-lg border border-[color:var(--line-2)] grid place-items-center text-[color:var(--muted)] hover:text-[color:var(--text)] transition">
                  <Icon name="X" size={16} />
                </button>
              </div>
            </div>
            <div className="flex-1 relative bg-white">
              <iframe src={embedUrl} title={folderName} className="drive-frame"
                allow="autoplay"
                sandbox="allow-scripts allow-same-origin allow-popups allow-forms allow-top-navigation" />
            </div>
          </div>
        </div>
      );
    }

    function Contact() {
      const c = teacherInfo.contacts;
      const rows = [
        { icon: "Phone", label: "جوال", value: c.phone, href: `tel:${c.phone}` },
        { icon: "Mail", label: "بريد", value: c.email, href: `mailto:${c.email}` },
        { icon: "Linkedin", label: "LinkedIn", value: "linkedin.com/in/…", href: c.linkedin },
        { icon: "Github", label: "GitHub", value: "github.com/…", href: c.github },
        { icon: "Twitter", label: "X", value: "x.com/…", href: c.twitter },
      ];
      return (
        <section id="contact" className="relative py-20">
          <div className="max-w-6xl mx-auto px-5 md:px-8">
            <div className="panel p-6 md:p-10 relative overflow-hidden">
              <div className="absolute inset-0 grid-bg opacity-60 pointer-events-none"></div>
              <div className="relative grid md:grid-cols-5 gap-8">
                <div className="md:col-span-2">
                  <div className="font-mono-lat text-xs text-[color:var(--cyan)]" dir="ltr">// contact</div>
                  <h2 className="font-display font-semibold text-3xl md:text-4xl tracking-tight mt-2">لنتعاون</h2>
                  <p className="font-serif-text text-[color:var(--muted)] mt-3 text-sm leading-[1.9] max-w-md">
                    سواء كان مشروعًا تعليميًا، ورشة، أو تطوير محتوى تقني للطالبات — مساحتي مفتوحة دومًا.
                  </p>
                  <a href={`mailto:${c.email}`}
                    className="inline-flex items-center gap-2 mt-6 px-4 py-2.5 rounded-lg border border-[color:var(--cyan)]/40 text-[color:var(--cyan)] hover:bg-[color:var(--cyan)]/10 transition text-sm">
                    <Icon name="Send" size={15} />
                    ابدء محادثة
                  </a>
                </div>
                <div className="md:col-span-3 grid sm:grid-cols-2 gap-3">
                  {rows.map((r) => (
                    <a key={r.label} href={r.href} target="_blank" rel="noreferrer"
                      className="panel-2 p-4 flex items-center gap-3 hover:border-[color:var(--line-2)] transition group">
                      <span className="w-10 h-10 rounded-lg grid place-items-center border border-[color:var(--line-2)] bg-[color:var(--panel)]">
                        <Icon name={r.icon} size={16} className="text-[color:var(--cyan)]" />
                      </span>
                      <span className="flex-1 min-w-0">
                        <span className="block text-xs text-[color:var(--muted)]">{r.label}</span>
                        <span className="block text-sm font-mono-lat truncate" dir="ltr">{r.value}</span>
                      </span>
                      <Icon name="ArrowUpLeft" size={14} className="text-[color:var(--muted)] group-hover:text-[color:var(--cyan)] rtl-flip" />
                    </a>
                  ))}
                </div>
              </div>
            </div>
          </div>
        </section>
      );
    }

    function Footer() {
      const y = new Date().getFullYear();
      return (
        <footer className="border-t border-[color:var(--line)] py-8 mt-10">
          <div className="max-w-6xl mx-auto px-5 md:px-8 flex flex-wrap items-center justify-between gap-4 text-xs text-[color:var(--muted)]">
            <div className="flex items-center gap-2">
              <Icon name="Code2" size={14} className="text-[color:var(--cyan)]" />
              <span>{teacherInfo.name} · جميع الحقوق محفوظة © {y}</span>
            </div>
            <div className="font-mono-lat" dir="ltr">built with care · v1.0</div>
          </div>
        </footer>
      );
    }

    function App() {
      return (
        <div className="relative" dir="rtl" lang="ar">
          <Nav />
          <main>
            <Hero />
            <Stats />
            <Portfolio />
            <Contact />
          </main>
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>

</html>
